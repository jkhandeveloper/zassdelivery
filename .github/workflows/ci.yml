name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# A newer push to the same branch cancels the in-flight run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  quality:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:cov

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zass
          POSTGRES_PASSWORD: zass_ci_password
          POSTGRES_DB: zassdelivery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zass -d zassdelivery_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://zass:zass_ci_password@localhost:5432/zassdelivery_test?schema=public
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      REDIS_DB: 0
      REDIS_KEY_PREFIX: 'zass_ci:'
      JWT_ACCESS_SECRET: ci_access_secret_that_is_at_least_32_chars
      JWT_REFRESH_SECRET: ci_refresh_secret_that_is_at_least_32_chr
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 30d
      LOG_LEVEL: error
      SWAGGER_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply migrations
        # `deploy` is the non-interactive form; `migrate dev` can prompt and
        # would hang a CI runner.
        run: npx prisma migrate deploy

      - name: Seed reference data
        run: npx prisma db seed

      - name: Run e2e tests
        run: npm run test:e2e

  build:
    name: Build & Docker image
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Compile
        run: npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: false
          tags: zassdelivery-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
